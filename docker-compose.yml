services:
  db:
    image: postgres:16
    container_name: v360_todolist_db
    restart: always
    environment:
      POSTGRES_USER: v360
      POSTGRES_PASSWORD: v360
      POSTGRES_DB: todolist_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: